[package]
name = "wfront"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wfront"
path = "src/main.rs"

[dependencies]
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
axum       = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = "0.3"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = "0.4"
rand       = "0.8"

# Cle d'administration : verification des signatures Ed25519.
ed25519-dalek = "2"
base64        = "0.22"
# Cles d'acces (passkeys) de l'administration : verification des
# signatures ES256 / RS256 et des empreintes SHA-256.
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rsa  = { version = "0.9", features = ["sha2"] }
# Comptes des joueurs : empreinte Argon2id des mots de passe.
argon2 = { version = "0.5.3", features = ["std"] }

[profile.release]
opt-level = 3
