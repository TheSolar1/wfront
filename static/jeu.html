<!DOCTYPE html>
<html lang="fr" data-theme="__THEME__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldFront</title>
  <link rel="icon" type="image/svg+xml" href="static/img/worldfront.svg">
  <link rel="stylesheet" href="static/css/theme.css?v=__V__">
  <link rel="stylesheet" href="static/css/worldfront.css?v=__V__">
  <meta name="theme-color" content="#4fa553">
</head>
<body class="wf-jeu" data-vex="__VEX__" data-connexion="__CONNEXION__" data-mode="__MODE__" data-invite="__INVITE__" data-vex-direct="__VEX_DIRECT__">

  <!-- ── Barre de navigation VEX ─────────────────────────────── -->
  <div class="top-nav-bar-haut7844" role="navigation">
    <div class="top-nav-left-7844">
      <button class="apps-btn-nav-7844 wf-apps-vex" id="apps-btn-nav" aria-label="Applications">
        <img src="static/img/solid/table-cells.svg" class="topbar-btn-svg-7844" alt="apps">
      </button>
      <a href="./" title="WorldFront"><img src="static/img/worldfront.svg" alt="WorldFront" class="nav-logo-flat-7844 wf-nav-logo"></a>
    </div>
    <div class="top-nav-right-7844">
      <span class="wf-nav-horloge"><span id="wf-connexion" class="wf-connexion" title="Connexion…"></span><span id="wf-horloge"></span></span>
      <div class="user-info-top-7844" id="user-info-top" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
        <span class="user-name-top-7844">__NOM__</span>
        <img src="static/img/solid/user.svg" class="user-icon-top-7844" alt="profil">
      </div>
    </div>
  </div>
  <!-- Grille d'applications VEX (comme build_nav_html() de VEX) -->
  <div class="apps-popup-7844" id="apps-popup">
    <div class="apps-grid-7844">
      <a class="app-item-7844" href="__VEX__/login/dashboard" title="Accueil"><span class="app-icon-wrap-7844"><img src="static/img/solid/home.svg" alt="" class="app-svg-icon-7844"></span><span class="app-label-7844">Accueil</span></a>
      <a class="app-item-7844" href="__VEX__/mess/" title="Mail"><span class="app-icon-wrap-7844"><img src="static/img/solid/envelope.svg" alt="" class="app-svg-icon-7844"></span><span class="app-label-7844">Mail</span></a>
      <a class="app-item-7844" href="__VEX__/fchier/" title="Fichiers"><span class="app-icon-wrap-7844"><img src="static/img/solid/folder-open.svg" alt="" class="app-svg-icon-7844"></span><span class="app-label-7844">Fichiers</span></a>
      <a class="app-item-7844" href="__VEX__/viso/" title="Vidéos"><span class="app-icon-wrap-7844"><img src="static/img/solid/video.svg" alt="" class="app-svg-icon-7844"></span><span class="app-label-7844">Vidéos</span></a>
      <a class="app-item-7844" href="__VEX__/sitec/" title="Sitec"><span class="app-icon-wrap-7844"><img src="static/img/solid/globe.svg" alt="" class="app-svg-icon-7844"></span><span class="app-label-7844">Sitec</span></a>
      <a class="app-item-7844" href="__VEX__/recherche/" title="Recherche"><span class="app-icon-wrap-7844"><img src="static/img/solid/magnifying-glass.svg" alt="" class="app-svg-icon-7844"></span><span class="app-label-7844">Recherche</span></a>
    </div>
  </div>
  <div class="profile-menu-7844" id="profile-menu" role="menu">
    <a href="__VEX__/login/account" class="wf-lien-vex"><img src="static/img/solid/user-circle.svg" class="pm-icon-svg-7844" alt="">Mon Compte</a>
    <a href="./"><img src="static/img/solid/circle-info.svg" class="pm-icon-svg-7844" alt="">À propos de WorldFront</a>
    <a href="__VEX__/login/logout"><img src="static/img/solid/right-from-bracket.svg" class="pm-icon-svg-7844" alt="">Déconnexion</a>
  </div>

  <!-- ── Jeu ──────────────────────────────────────────────────── -->
  <div class="wf-app">
    <aside class="wf-side">
      <div class="wf-nation" id="wf-nation"></div>
      <nav class="wf-menu" id="wf-menu"></nav>
    </aside>

    <main class="wf-main">
      <div class="wf-resbar" id="wf-resbar"></div>
      <div class="wf-carte" id="wf-carte">
        <div id="wf-carte-3d" class="wf-carte-3d"></div>

        <div class="wf-outils">
          <div class="wf-segment">
            <button class="actif" data-mode-carte="politique" title="Carte politique"><i class="ico" style="--ic:url('__P__/static/img/solid/flag.svg')"></i><span>Politique</span></button>
            <button data-mode-carte="terrain" title="Relief et terrains"><i class="ico" style="--ic:url('__P__/static/img/solid/mountain.svg')"></i><span>Terrain</span></button>
            <button data-mode-carte="ressources" title="Gisements"><i class="ico" style="--ic:url('__P__/static/img/solid/gem.svg')"></i><span>Ressources</span></button>
          </div>
          <button class="wf-outil" id="wf-recentrer" title="Revenir à ma capitale"><i class="ico" style="--ic:url('__P__/static/img/solid/house-flag.svg')"></i></button>
          <button class="wf-outil" id="wf-vue-globale" title="Vue d'ensemble"><i class="ico" style="--ic:url('__P__/static/img/solid/earth-europe.svg')"></i></button>
        </div>

        <div class="wf-troupes" id="wf-troupes" hidden>
          <div class="wf-troupes-tete">
            <i class="ico" style="--ic:url('__P__/static/img/solid/person-military-rifle.svg')"></i>
            <b id="wf-troupes-n">0</b><span>/ <span id="wf-troupes-max">0</span></span>
            <span class="wf-troupes-off" id="wf-troupes-off"></span>
            <button class="wf-btn-ic wf-troupes-replier" data-act="reduire_troupes" title="Réduire / agrandir"><i class="ico" style="--ic:url('__P__/static/img/solid/chevron-down.svg')"></i></button>
          </div>
          <div class="wf-barre"><div id="wf-troupes-barre"></div></div>
          <div class="wf-troupes-ratio">
            <span>Envoyer <b id="wf-ratio-val">30 %</b> = <b id="wf-ratio-envoi">0</b> troupes</span>
            <input type="range" id="wf-ratio" min="5" max="100" step="5" value="30" aria-label="Part des troupes envoyée">
            <div class="wf-troupes-presets">
              <button data-ratio="10">10 %</button><button data-ratio="25">25 %</button><button data-ratio="50">50 %</button><button data-ratio="75">75 %</button><button data-ratio="100">100 %</button>
            </div>
          </div>
          <small>Clic droit sur une case : s'étendre ou attaquer · clic gauche : construire</small>
        </div>
        <div class="wf-propositions" id="wf-propositions" hidden></div>
        <div class="wf-consigne" id="wf-consigne" hidden></div>
        <div class="wf-missiles" id="wf-missiles" hidden></div>
        <div class="wf-survol" id="wf-survol" hidden></div>
        <div class="wf-inspecteur" id="wf-inspecteur" hidden></div>
        <div class="wf-hors-ligne" id="wf-hors-ligne" hidden><i class="ico" style="--ic:url('__P__/static/img/solid/plug-circle-xmark.svg')"></i> Connexion perdue — reconnexion en cours…</div>
      </div>

      <section class="wf-panneau" id="wf-panneau" aria-live="polite">
        <header class="wf-panneau-tete">
          <div id="wf-panneau-titre" class="wf-panneau-titre"></div>
          <button class="wf-btn-ic" data-act="fermer_panneau" title="Fermer (Échap)"><i class="ico" style="--ic:url('__P__/static/img/solid/xmark.svg')"></i></button>
        </header>
        <div class="wf-panneau-corps" id="wf-panneau-corps"></div>
      </section>
    </main>
  </div>

  <div class="wf-toasts" id="wf-toasts"></div>
  <div class="wf-modale-fond" id="wf-modale" hidden></div>
  <div class="wf-flash" id="wf-flash"></div>
  <div class="wf-chargement" id="wf-chargement">
    <div class="wf-chargement-boite">
      <img src="static/img/solid/earth-europe.svg" alt="" class="wf-chargement-logo">
      <b>WorldFront</b>
      <span>Connexion au monde…</span>
      <div class="wf-barre anim"><div></div></div>
    </div>
  </div>

  <script src="static/js/nav.js?v=__V__"></script>
  <!-- Versionne aussi les modules importes par jeu.js (cache du navigateur). -->
  <script type="importmap">{ "imports": { "__P__/static/js/carte.js": "__P__/static/js/carte.js?v=__V__", "__P__/static/js/util.js": "__P__/static/js/util.js?v=__V__", "__P__/static/js/panneaux.js": "__P__/static/js/panneaux.js?v=__V__", "__P__/static/js/modeles.js": "__P__/static/js/modeles.js?v=__V__", "__P__/static/vendor/three.module.min.js": "__P__/static/vendor/three.module.min.js?v=__V__" } }</script>
  <script type="module" src="static/js/jeu.js?v=__V__"></script>
</body>
</html>
